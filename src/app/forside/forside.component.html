<div class="info-panel">
  <div class="header">
    <h1 class="title">Driftsinformationer</h1>
    <button mat-mini-fab color="accent" routerLink="/opret-info" aria-label="Opret driftsmeddelelse">
      <mat-icon>add</mat-icon>
    </button>
  </div>
  @if (infos$ | async; as infos) {
    <mat-tab-group>
      <mat-tab label="Aktuelle">
        @if (!infos.aktuelle.length) {
          <p>Ingen aktuelle driftsmeddelelser.</p>
        }
        <app-driftsinfo-list [driftsinfos]="infos.aktuelle" (infoRettet)="reloadInfo()" (infoSlettet)="reloadInfo()"></app-driftsinfo-list>
      </mat-tab>
      <mat-tab label="Planlagte">
        @if (!infos.planlagte.length) {
          <mat-card class="driftsinfo-card mat-elevation-z7">
            Ingen planlagte driftsmeddelelser.
          </mat-card>
        }
        <app-driftsinfo-list [driftsinfos]="infos.planlagte" (infoRettet)="reloadInfo()" (infoSlettet)="reloadInfo()"></app-driftsinfo-list>
      </mat-tab>
      <mat-tab label="Tidligere">
        <app-driftsinfo-list [driftsinfos]="infos.tidligere" (infoRettet)="reloadInfo()" (infoSlettet)="reloadInfo()"></app-driftsinfo-list>
      </mat-tab>
    </mat-tab-group>
  } @else {
    <mat-spinner></mat-spinner>
  }
</div>
