<mat-sidenav-container fullscreen>

  <mat-sidenav #start (click)="start.close()">
    <mat-nav-list>

      @if (user.isLoggedOut$ | async) {
        <a mat-list-item routerLink="login">
          <mat-icon>account_circle</mat-icon>
          <span>Log ind</span>
        </a>
      }

      @if (user.isLoggedIn$ | async) {
        <a mat-list-item (click)="logout()">
          <mat-icon>exit_to_app</mat-icon>
          <span>Log ud</span>
        </a>
      }

    </mat-nav-list>

  </mat-sidenav>

  <mat-toolbar color="primary">

    <div class="toolbar-tools">

      <button mat-icon-button (click)="start.open('mouse')" aria-label="Åbn menu">
        <mat-icon>menu</mat-icon>
      </button>

      <div class="filler"></div>

      @if ((user.pictureUrl$ | async); as pictureUrl) {
        <img class="user-avatar" [src]="pictureUrl" alt="Brugerprofil">
      }

    </div>


  </mat-toolbar>

  <router-outlet></router-outlet>

</mat-sidenav-container>
