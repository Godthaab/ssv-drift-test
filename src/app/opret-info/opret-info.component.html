<div class="info-panel">
  <h1>Opret ny information</h1>

  <form [formGroup]="form">
    <!-- Overskrift -->
    <mat-form-field appearance="outline">
      <input placeholder="Overskrift" matInput formControlName="overskrift" />
    </mat-form-field>
    <!-- Beskrivelse -->
    <mat-form-field appearance="outline">
      <textarea
        matInput
        placeholder="Beskrivelse"
        formControlName="beskrivelse"
      ></textarea>
    </mat-form-field>
    <!-- Berørte -->
    <mat-form-field appearance="outline">
      <input placeholder="Berørte" matInput formControlName="berorte" />
    </mat-form-field>
    <p *ngIf="!form.controls['visAltid'].value">
      Før starttidspunktet vises posten under Planlagte. Fra start til slut
      vises den under Aktuelle, og ved sluttidspunktet flyttes den til Tidligere.
    </p>
    <!-- Publiceres -->
    <mat-form-field>
      <input
        matInput
        [mtxDatetimepicker]="pubPicker"
        [placeholder]="
          form.controls['visAltid'].value
            ? 'Dato til sortering'
            : 'Publicering: dato og tid'
        "
        formControlName="publiceres"
      />
      <mtx-datetimepicker-toggle
        matSuffix
        [for]="pubPicker"
      ></mtx-datetimepicker-toggle>
      <mtx-datetimepicker #pubPicker type="datetime"></mtx-datetimepicker>
    </mat-form-field>
    <!-- Aftages -->
    <mat-form-field *ngIf="!form.controls['visAltid'].value">
      <input
        matInput
        [mtxDatetimepicker]="aftagesPicker"
        placeholder="Vælg slut dato & tid"
        formControlName="aftages"
      />
      <mtx-datetimepicker-toggle
        matSuffix
        [for]="aftagesPicker"
      ></mtx-datetimepicker-toggle>
      <mtx-datetimepicker #aftagesPicker type="datetime"></mtx-datetimepicker>
    </mat-form-field>
    <p
      role="alert"
      *ngIf="form.hasError('endRequired') && form.controls['aftages'].touched"
    >
      Vælg en slutdato.
    </p>
    <p role="alert" *ngIf="form.hasError('dateRange')">
      Aftagningstidspunktet skal ligge efter publiceringstidspunktet.
    </p>
    <div>
      <br />
      <button
        mat-raised-button
        color="warn"
        [disabled]="!form.valid"
        (click)="onOpretInfo()"
      >
        Opret</button
      ><span style="padding-left: 12px">
        <button mat-raised-button (click)="close()">fortryd</button></span
      >
    </div>
  </form>
</div>
